name: Build, Test and Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ./main
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Compile main and test code
        run: ./gradlew build -x test
      - name: Run all tests (unit + Testcontainers integration)
        run: ./gradlew test
      - name: Upload JUnit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: main/build/reports/tests/test/
          retention-days: 14
      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: main/build/reports/jacoco/test/html/
          retention-days: 14

  containerize:
    name: Build and push Docker image
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./main
          file: ./main/Dockerfile
          push: true
          tags: ghcr.io/shadowsoldier1231/alfa-case5-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server (manual, SSH port 10991)
    needs: containerize
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pull new image and restart app on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: 10991
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script_stop: true
          script: |
            echo [DEPLOY] Starting && cd /d C:\Users\user\Desktop\AlphaBackend\main && echo [DEPLOY] CD OK %CD% && git pull origin main && echo [DEPLOY] Git OK && docker compose pull app && echo [DEPLOY] Pull OK && docker compose up -d app && echo [DEPLOY] Up OK && docker image prune -f && echo [DEPLOY] Done
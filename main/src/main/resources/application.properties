spring.application.name=main

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=2000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.task.scheduling.pool.size=5

spring.mail.host=smtp.mail.ru
spring.mail.port=465
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory

spring.data.redis.host=redisContainer
spring.data.redis.port=6379

spring.threads.virtual.enabled=true

spring.data.redis.repositories.enabled=false

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-path=never

spring.security.user.name=disabled
spring.security.user.password=disabled

# Environment variables
telegram.bot.username=${TELEGRAM_BOT_NAME:}
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
proxy.host=${APP_PROXY_HOST:127.0.0.1}
proxy.port=${APP_PROXY_PORT:1080}
proxy.enabled=${APP_PROXY_ENABLED:true}
spring.mail.username=${EMAIL_ADDRESS:}
spring.mail.password=${EMAIL_PASSWORD:}
jwt.secret=${JWT_SECRET:MySuperLongAndUltraSecureSecretKeyForThisApp}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/main}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:user1}
web.address.site=${WEBSITE_ADDRESS:}
app.s3.endpoint=${APP_S3_ENDPOINT:}
app.s3.access-key=${APP_S3_ACCESS_KEY:}
app.s3.secret-key=${APP_S3_SECRET_KEY:}
app.s3.bucket-name=${APP_S3_BUCKET_NAME:alfa-cases}
integration.ml.service-token=${ML_SERVICE_TOKEN}
integration.ml.service-header=${ML_SERVICE_HEADER}


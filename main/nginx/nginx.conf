
server {
    listen 80;
    server_name _;

    location /storage/ {
        rewrite ^/storage/(.*)$ /$1 break;
        proxy_pass http://minioContainer:9000;

        proxy_set_header Host minioContainer:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        client_max_body_size 10M;

        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_intercept_errors on;
        error_page 502 504 = @storage_error;

        add_header 'Access-Control-Allow-Origin' '${WEBSITE_ADDRESS}' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    location ~* ^/storage/.*\.(jpg|jpeg|png|gif|ico|pdf|webp)$ {
        rewrite ^/storage/(.*)$ /$1 break;
        proxy_pass http://minioContainer:9000;

        proxy_set_header Host minioContainer:9000;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;

        proxy_intercept_errors on;
        error_page 502 504 = @storage_error;

        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header 'Access-Control-Allow-Origin' '${WEBSITE_ADDRESS}' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        access_log off;
    }

    location @storage_error {
        return 503;
    }
}
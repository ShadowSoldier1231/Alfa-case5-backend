
services:
    db:
    image: postgres:16-alpine
    container_name: MainContainer
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-main}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-user1}
      
      POSTGRES_SHARED_BUFFERS: 128MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 256MB
      POSTGRES_WORK_MEM: 16MB
      POSTGRES_MAINTENANCE_WORK_MEM: 32MB
    
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    
    deploy:
      resources:
        limits:
          memory: 512M        
          cpus: '0.5'         
        reservations:
          memory: 256M        
          cpus: '0.25'        
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d main"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: SpringApp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/main
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      TELEGRAM_BOT_NAME: ${TELEGRAM_BOT_NAME}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      APP_PROXY_ENABLED: ${APP_PROXY_ENABLED}
      APP_PROXY_HOST: ${APP_PROXY_HOST}
      APP_PROXY_PORT: ${APP_PROXY_PORT}
      JWT_SECRET: ${JWT_SECRET}
      EMAIL_ADDRESS: ${EMAIL_ADDRESS}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}

    command: >
      java -Dhttp.proxyHost=${APP_PROXY_HOST}
           -Dhttp.proxyPort=${APP_PROXY_PORT}
           -Dhttps.proxyHost=${APP_PROXY_HOST}
           -Dhttps.proxyPort=${APP_PROXY_PORT}
           -Dhttp.nonProxyHosts=localhost|127.0.0.1|db
           -jar app.jar

    ports:
      - "${APP_PORT:-999}:8080"

volumes:
  postgres_data:
